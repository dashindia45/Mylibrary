# ══════════════════════════════════════════════════════════
# Render.com Infrastructure Blueprint for MyLibrary
# ══════════════════════════════════════════════════════════

databases:
  - name: mylibrary-db
    databaseName: mylibrary
    user: postgres
    plan: free
    region: oregon

services:
  # ─── API Backend ───
  - type: web
    name: mylibrary-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npx prisma db push --schema=apps/api/prisma/schema.prisma && npx tsx apps/api/prisma/seed.ts && npm run build:api
    startCommand: npm run start -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mylibrary-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: OTP_EXPIRY_SECONDS
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "30"
      - key: EMAIL_PROVIDER
        value: console
      - key: SMS_PROVIDER
        value: console
      - key: LIBRARY_TIMEZONE
        value: Asia/Kolkata

  # ─── Web Member Portal ───
  - type: web
    name: mylibrary-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mylibrary-api
          property: host

  # ─── Admin Dashboard ───
  - type: web
    name: mylibrary-admin
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run build:admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mylibrary-api
          property: host
